apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmaas-console
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bmaas-console
  template:
    metadata:
      labels:
        app: bmaas-console
    spec:
      containers:
        - name: web
          image: bmaas-console:0.1
          # 레지스트리 없이 노드의 containerd에 직접 불러온 이미지를 쓰므로 IfNotPresent
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
# Ingress 컨트롤러가 없는 클러스터에서도 노드 IP:30080으로 바로 접속할 수 있게 NodePort로 연다
apiVersion: v1
kind: Service
metadata:
  name: bmaas-console
spec:
  type: NodePort
  selector:
    app: bmaas-console
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
