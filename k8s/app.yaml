apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmaas-console
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bmaas-console
  template:
    metadata:
      labels:
        app: bmaas-console
    spec:
      containers:
        - name: web
          image: bmaas-console:0.1
          # 레지스트리 없이 k3s에 직접 불러온 이미지를 쓰므로 IfNotPresent
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bmaas-console
spec:
  selector:
    app: bmaas-console
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bmaas-console
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bmaas-console
                port:
                  number: 80
